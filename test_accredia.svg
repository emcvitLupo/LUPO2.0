<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="340" height="190">
  <defs>
    <style>
      .acc-bold { font-family: "Arial", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; }
      .acc-heavy { font-family: "Arial", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; }
      .acc-med { font-family: "Arial", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; }
      .acc-reg { font-family: "Arial", "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Bordo Contorno Ufficiale RG-09 per Marchio di Accreditamento Laboratorio -->
  <rect x="1" y="1" width="338" height="188" rx="4" fill="#ffffff" stroke="#002b49" stroke-width="1.8"/>

  <!-- SEZIONE SUPERIORE: LOGO ACCREDIA + SCRITTA ACCREDIA -->
  <g transform="translate(14, 14)">
    <!-- Simbolo "A" ACCREDIA Ufficiale -->
    <g id="accredia-symbol">
      <!-- Poligono Superiore Sinistro: Cyan / Teal -->
      <polygon points="12,2 35,2 27,33 4,33" fill="#00838f" />
      
      <!-- Poligono Inferiore Sinistro: Blu Elettrico -->
      <polygon points="3,38 26,38 18,69 0,69" fill="#004a87" />
      
      <!-- Ala Curva Destra: Deep Navy -->
      <path d="M 40,2 C 52,2 66,16 70,39 C 72,50 73,61 73,69 L 50,69 C 50,62 49,53 47,44 C 45,33 38,22 33,14 L 37,2 Z" fill="#002b49" />
    </g>
    
    <!-- Testo "ACCREDIA" e "L'ENTE ITALIANO DI ACCREDITAMENTO" -->
    <g transform="translate(82, 0)">
      <text x="0" y="42" fill="#002b49" font-size="38" letter-spacing="1.2" class="acc-bold">ACCREDIA</text>
      <text x="1" y="60" fill="#002b49" font-size="7.5" letter-spacing="0.6" class="acc-heavy">L'ENTE ITALIANO DI ACCREDITAMENTO</text>
    </g>
  </g>

  <!-- LINEA DIVISORIA ORIZZONTALE -->
  <line x1="1" y1="88" x2="339" y2="88" stroke="#002b49" stroke-width="1.6" />

  <!-- SEZIONE INFERIORE: MARCHIO LABORATORIO DI PROVA E MUTUO RICONOSCIMENTO -->
  <g transform="translate(0, 92)">
    <!-- Numero Accreditamento Laboratorio -->
    <text x="170" y="24" fill="#002b49" font-size="18.5" letter-spacing="1" text-anchor="middle" class="acc-bold">LAB N° 00438 L</text>
    
    <!-- Diciture Accordi di Mutuo Riconoscimento EA, IAF e ILAC -->
    <text x="170" y="45" fill="#002b49" font-size="8.8" text-anchor="middle" class="acc-med">Membro degli Accordi di Mutuo Riconoscimento</text>
    <text x="170" y="60" fill="#002b49" font-size="11.5" letter-spacing="1.2" text-anchor="middle" class="acc-heavy">EA, IAF e ILAC</text>
    <text x="170" y="75" fill="#002b49" font-size="7.2" text-anchor="middle" class="acc-reg">Signatory of EA, IAF and ILAC Mutual Recognition Agreements</text>
  </g>
</svg>