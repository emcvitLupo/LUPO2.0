    <text x="188.68" y="230.38" class="txt-accredia" text-anchor="middle" dominant-baseline="central" transform="rotate(-22.29, 188.68, 230.38)">D</text>
    <text x="211.59" y="217.31" class="txt-accredia" text-anchor="middle" dominant-baseline="central" transform="rotate(-37.14, 211.59, 217.31)">I</text>
    <text x="230.38" y="198.80" class="txt-accredia" text-anchor="middle" dominant-baseline="central" transform="rotate(-52.00, 230.38, 198.80)">A</text>

