    <text x="201.00" y="47.67" class="txt-testing" text-anchor="middle" dominant-baseline="central" transform="rotate(30.00, 201.00, 47.67)">N</text>
    <text x="222.12" y="63.88" class="txt-testing" text-anchor="middle" dominant-baseline="central" transform="rotate(45.00, 222.12, 63.88)">G</text>

  <!-- SIMBOLO CENTRALE: A STILIZZATA SINAL / ACCREDIA -->
  <g id="center-symbol" transform="translate(150, 136)">
    <!-- Gamba Sinistra Nera -->
    <polygon points="-46,38 -34,38 0,-44 -12,-44" fill="#111111" />
    
    <!-- Vertice superiore orizzontale/tagliato -->
    <polygon points="-12,-44 16,-44 6,-24 -7,-24" fill="#111111" />
    
    <!-- Gamba destra superiore -->
    <polygon points="16,-44 6,-24 16,-4 27,-4" fill="#111111" />
    
    <!-- Gamba destra media (tra le due strisce) -->
    <polygon points="18,1 9,1 12,11 23,11" fill="#111111" />
    
    <!-- Gamba destra inferiore e piede orizzontale -->
    <polygon points="25,16 14,16 21,38 48,38 48,27 30,27" fill="#111111" />

    <!-- STRISCIA ARANCIONE SUPERIORE (Chiara) -->
    <polygon points="-23,-6 43,-6 43,1 -20,1" fill="#f59b38" />

    <!-- STRISCIA ARANCIONE INFERIORE (Scura / Intensa) -->
    <polygon points="-15,8 45,8 45,15 -12,15" fill="#d35400" />
  </g>

  <!-- TESTO CURVO INFERIORE: ACCREDIA -->
    <text x="69.62" y="198.80" class="txt-accredia" text-anchor="middle" dominant-baseline="central" transform="rotate(52.00, 69.62, 198.80)">A</text>
    <text x="88.41" y="217.31" class="txt-accredia" text-anchor="middle" dominant-baseline="central" transform="rotate(37.14, 88.41, 217.31)">C</text>
