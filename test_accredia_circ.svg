<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330" width="300" height="330">
  <defs>
    <!-- Path per il testo circolare superiore: TESTING -->
    <path id="top-arc" d="M 50,140 A 100,100 0 0,1 250,140" fill="none" />
    
    <!-- Path per il testo circolare inferiore: ACCREDIA (da sinistra a destra lungo la curva inferiore) -->
    <path id="bottom-arc" d="M 45,145 A 105,105 0 0,0 255,145" fill="none" />
    
    <style>
      .txt-testing {
        font-family: "Arial", "Helvetica Neue", sans-serif;
        font-size: 21px;
        font-weight: 800;
        fill: #111111;
        letter-spacing: 3.5px;
      }
      .txt-accredia {
        font-family: "Arial Black", "Arial", "Helvetica Neue", sans-serif;
        font-size: 27px;
        font-weight: 900;
        fill: #111111;
        letter-spacing: 4.5px;
      }
      .txt-number {
        font-family: "Arial", "Helvetica Neue", sans-serif;
        font-size: 21px;
        font-weight: 800;
        fill: #002b49;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Sfondo trasparente/bianco -->
  <rect width="300" height="330" fill="none" />

  <!-- CERCHIO ESTERNO -->
  <circle cx="150" cy="140" r="126" fill="#ffffff" stroke="#111111" stroke-width="3.2" />

  <!-- CERCHIO INTERNO -->
  <circle cx="150" cy="140" r="88" fill="#ffffff" stroke="#111111" stroke-width="2.6" />

  <!-- TESTO SUPERIORE: TESTING -->
  <text class="txt-testing">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      TESTING
    </textPath>
  </text>

  <!-- SIMBOLO CENTRALE: A STILIZZATA SINAL / ACCREDIA -->
  <g id="center-symbol" transform="translate(150, 140)">
    <!-- Gamba sinistra e vertice della A in Nero -->
    <!-- Coordinate relative al centro (0,0) -->
    <!-- Gamba Sinistra -->
    <polygon points="-52,32 -38,32 0,-56 -14,-56" fill="#111111" />
    
    <!-- Vertice superiore orizzontale/tagliato -->
    <polygon points="-14,-56 18,-56 8,-32 -8,-32" fill="#111111" />
    
    <!-- Gamba destra superiore -->
    <polygon points="18,-56 8,-32 19,-7 33,-7" fill="#111111" />
    
    <!-- Gamba destra media (tra le due strisce) -->
    <polygon points="21,-2 11,-2 14,8 27,8" fill="#111111" />
    
    <!-- Gamba destra inferiore e piede orizzontale -->
    <polygon points="29,13 16,13 23,32 54,32 54,20 33,20" fill="#111111" />

    <!-- STRISCIA ARANCIONE SUPERIORE (Chiara) -->
    <polygon points="-24,-7 48,-7 48,0 -21,0" fill="#f59b38" />

    <!-- STRISCIA ARANCIONE INFERIORE (Scura / Intensa) -->
    <polygon points="-16,8 50,8 50,15 -13,15" fill="#d35400" />
  </g>

  <!-- TESTO INFERIORE CURVO: ACCREDIA -->
  <text class="txt-accredia">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      ACCREDIA
    </textPath>
  </text>

  <!-- NUMERO ACCREDITAMENTO SOTTO IL CERCHIO: 00438 -->
  <text x="150" y="304" text-anchor="middle" class="txt-number">00438</text>
</svg>