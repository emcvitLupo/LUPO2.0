<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 316" width="300" height="316">
  <defs>
    <style>
      .txt-testing {
        font-family: "Arial", "Helvetica Neue", sans-serif;
        font-size: 20px;
        font-weight: 800;
        fill: #111111;
        letter-spacing: 2px;
      }
      .txt-accredia {
        font-family: "Arial Black", "Arial", "Helvetica Neue", sans-serif;
        font-size: 25px;
        font-weight: 900;
        fill: #111111;
        letter-spacing: 3px;
      }
      .txt-number {
        font-family: "Arial", "Helvetica Neue", sans-serif;
        font-size: 23px;
        font-weight: 800;
        fill: #002b49;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Sfondo trasparente -->
  <rect width="300" height="316" fill="none" />

  <!-- CERCHIO ESTERNO -->
  <circle cx="150" cy="136" r="122" fill="#ffffff" stroke="#111111" stroke-width="3" />

  <!-- CERCHIO INTERNO -->
  <circle cx="150" cy="136" r="82" fill="#ffffff" stroke="#111111" stroke-width="2.4" />

  <!-- TESTO CURVO SUPERIORE: TESTING -->
    <text x="77.88" y="63.88" class="txt-testing" text-anchor="middle" dominant-baseline="central" transform="rotate(-45.00, 77.88, 63.88)">T</text>
    <text x="99.00" y="47.67" class="txt-testing" text-anchor="middle" dominant-baseline="central" transform="rotate(-30.00, 99.00, 47.67)">E</text>
